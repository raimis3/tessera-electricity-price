# Electricity price: the price of power now as a tile, and the graph of today and tomorrow on bigger tiles and on a
# card, with the person's own tariff on top. This fork keeps the Nord Pool integration only.
# It reads the Nord Pool sensor from Home Assistant.
id: electricity_price
version: 0.13.2
api: "0.26"
icon: flash
maintainer: Heronimonimo
license: MIT
stage: beta
topics: [energy]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 30

# The current price of a tile can also appear in the top bar.
bar_items:
  - { id: price, label: bar_price, icon: flash, example: bar_example }

tiles:
  - id: nordpool
    name: tile_name_nordpool
    icon: flash
    sizes: { min: 1x1, max: 9x9, full: true }
    memory: 8000
    domains: [sensor]
    attributes: [unit_of_measurement]
    has_attributes: [raw_today]
    fields:
      today: { path: "raw_today[*].value", as: numbers }
      tomorrow: { path: "raw_tomorrow[*].value", as: numbers }
    example: tile_example
    preview: { title: "{name}", value: "{state} {unit_of_measurement}" }
    options:
      - id: unit
        kind: choice
        default: eur
        label: unit
        hint: unit_hint
        choices:
          - { value: eur, label: unit_eur }
          - { value: cents, label: unit_cents }
      - { id: fixed, kind: number, min: 0, max: 4, step: 1, default: 3, label: decimals, hint: decimals_hint }
      - { id: delivery, kind: text, default: "", label: delivery, hint: delivery_hint }
      - id: graph
        kind: choice
        default: bars
        label: graph
        hint: graph_hint
        choices:
          - { value: bars, label: graph_bars }
          - { value: line, label: graph_line }
      - { id: fill, kind: toggle, default: true, label: fill, hint: fill_hint }
      - id: grid
        kind: choice
        default: none
        label: grid
        hint: grid_hint
        choices:
          - { value: none, label: grid_none }
          - { value: solid, label: grid_solid }
          - { value: dotted, label: grid_dotted }
      - id: resolution
        kind: choice
        default: quarter
        label: resolution
        hint: resolution_hint
        choices:
          - { value: quarter, label: resolution_quarter }
          - { value: hour, label: resolution_hour }
      - { id: cheap, kind: number, min: 0, max: 6, step: 1, default: 0, label: cheap, hint: cheap_hint }
      - id: cheap_mode
        kind: choice
        default: single
        label: cheap_mode
        hint: cheap_mode_hint
        choices:
          - { value: single, label: cheap_single }
          - { value: block, label: cheap_block }
      - { id: show_name, kind: toggle, default: true, label: show_name, hint: show_name_hint }
      - { id: cheap_below, kind: number, min: -1000, max: 1000, step: 0.01, label: cheap_below, hint: cheap_below_hint }
      - { id: expensive_above, kind: number, min: -1000, max: 1000, step: 0.01, label: expensive_above, hint: expensive_above_hint }

cards:
  - { id: prices, name: card_name, wide: true }
